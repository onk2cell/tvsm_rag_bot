[pytest]
markers =
    live: hits a real Gemini endpoint and needs a working GEMINI_API_KEY.
        Deselected in CI with -m "not live". Nothing carries this today —
        the classifiers are injectable and tests/conftest.py stubs them, so
        the suite is hermetic. Kept registered so a future test that truly
        needs a live call has to say so out loud.
    live_classifier: opt out of the autouse classifier stubbing in
        tests/conftest.py, for a test that supplies its own LLM fake and
        wants the real graph to run.
