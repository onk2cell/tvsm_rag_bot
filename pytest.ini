[pytest]
markers =
    live: hits a real Gemini endpoint and needs a working GEMINI_API_KEY.
        Deselected in CI with -m "not live". These exist because the
        bot.graph classifiers are imported as module-level functions into
        client_processing, so a test whose input falls past the regex fast
        path reaches the real API with no seam to stub. Making the
        classifiers injectable would let these run hermetically.
