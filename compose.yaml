services:
  web:
    build: .
    command: uvicorn web:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  webhook:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: rq worker --url redis://redis:6379
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  client-webhook:
    profiles: ["client"]
    build: .
    command: uvicorn client_webhook:app --host 0.0.0.0 --port 8002
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client
      CLIENT_ENV: production
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "false"
      CLIENT_STUB_CUSTOMER: "true"
      CLIENT_REPLY_AUTH_MODE: api_key
      CLIENT_REPLY_WEBHOOK_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/send
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      client-worker:
        condition: service_healthy
    restart: unless-stopped

  client-worker:
    profiles: ["client"]
    build: .
    command: python client_worker.py
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client
      CLIENT_ENV: production
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "false"
      CLIENT_STUB_CUSTOMER: "true"
      CLIENT_REPLY_AUTH_MODE: api_key
      CLIENT_REPLY_WEBHOOK_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/send
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; os.kill(1, 0)",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  client-webhook-mock:
    profiles: ["mock"]
    build: .
    command: uvicorn client_webhook:app --host 0.0.0.0 --port 8001
    env_file:
      - .env.mock
    ports:
      - "8004:8001"
    depends_on:
      redis:
        condition: service_healthy
      mock-client:
        condition: service_healthy
      mock-worker:
        condition: service_healthy

  mock-worker:
    profiles: ["mock"]
    build: .
    command: python client_worker.py
    env_file:
      - .env.mock
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mock-client:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; os.kill(1, 0)",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  mock-client:
    profiles: ["mock"]
    build: .
    command: uvicorn mock_client:app --host 0.0.0.0 --port 8002
    env_file:
      - .env.mock
    ports:
      - "8003:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  client-webhook-real-chat:
    profiles: ["real-chat-test"]
    build: .
    command: uvicorn client_webhook:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
      - .env.mock
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client-real-chat
      CLIENT_TEST_MODE: "false"
      CLIENT_ENV: test
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_CRM_CUSTOMER_URL: http://real-chat-client:8002/mock/customers
      CLIENT_REPLY_WEBHOOK_URL: http://real-chat-client:8002/mock/replies
      CLIENT_TEST_MEDIA_HOSTS: real-chat-client
    ports:
      - "8005:8001"
    depends_on:
      redis:
        condition: service_healthy
      real-chat-client:
        condition: service_healthy
      real-chat-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  real-chat-worker:
    profiles: ["real-chat-test"]
    build: .
    command: python client_worker.py
    env_file:
      - .env
      - .env.mock
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client-real-chat
      CLIENT_TEST_MODE: "false"
      CLIENT_ENV: test
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_CRM_CUSTOMER_URL: http://real-chat-client:8002/mock/customers
      CLIENT_REPLY_WEBHOOK_URL: http://real-chat-client:8002/mock/replies
      CLIENT_TEST_MEDIA_HOSTS: real-chat-client
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      real-chat-client:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; os.kill(1, 0)",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  real-chat-client:
    profiles: ["real-chat-test"]
    build: .
    command: uvicorn mock_client:app --host 0.0.0.0 --port 8002
    env_file:
      - .env.mock
    environment:
      MOCK_BOT_WEBHOOK_URL: http://client-webhook-real-chat:8001/client/webhook/messages
    ports:
      - "8003:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
