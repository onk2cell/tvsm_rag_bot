services:
  web:
    build: .
    command: uvicorn web:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  webhook:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: rq worker --url redis://redis:6379
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
