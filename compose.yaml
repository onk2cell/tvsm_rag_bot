services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Production JAM CRM WhatsApp bot
  client-webhook:
    profiles: ["client"]
    build: .
    command: uvicorn client_webhook:app --host 0.0.0.0 --port 8002
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client
      CLIENT_ENV: production
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "false"
      CLIENT_STUB_CUSTOMER: "false"
      CLIENT_REPLY_AUTH_MODE: api_key
      CLIENT_REPLY_WEBHOOK_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/send
      CLIENT_CRM_CUSTOMER_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/customer
    ports:
      - "8002:8002"
      - "8004:8002"
    depends_on:
      redis:
        condition: service_healthy
      client-worker:
        condition: service_healthy
    restart: unless-stopped

  # Admin control panel — edit live bot config + set the runtime Gemini key.
  # Shares ./data with the worker, so saved config + key reach it on the next turn.
  admin:
    profiles: ["client"]
    build: .
    command: uvicorn web:app --host 0.0.0.0 --port 8002
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_ENV: production
    volumes:
      - ./data:/app/data
    ports:
      - "8006:8002"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  client-worker:
    profiles: ["client"]
    build: .
    command: python client_worker.py
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client
      CLIENT_ENV: production
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "false"
      CLIENT_STUB_CUSTOMER: "false"
      CLIENT_REPLY_AUTH_MODE: api_key
      CLIENT_REPLY_WEBHOOK_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/send
      CLIENT_CRM_CUSTOMER_URL: https://tvsm.jamoutsourcing.com/index.php/whatsapp_bot/customer
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # Local lab: mock CRM chat UI → real webhook → worker → mock replies
  mock-client:
    profiles: ["lab"]
    build: .
    command: uvicorn mock_client:app --host 0.0.0.0 --port 8002
    env_file:
      - .env.mock
    environment:
      REDIS_URL: redis://redis:6379
      MOCK_BOT_WEBHOOK_URL: http://lab-webhook:8001/client/webhook/messages
      MOCK_BOT_WEBHOOK_USER: mock-app
      MOCK_BOT_WEBHOOK_PASSWORD: mock-app-secret
    ports:
      - "8003:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  lab-webhook:
    profiles: ["lab"]
    build: .
    command: uvicorn client_webhook:app --host 0.0.0.0 --port 8001
    env_file:
      - .env.mock
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client-lab
      CLIENT_ENV: test
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "true"
      CLIENT_STUB_CUSTOMER: "false"
      CLIENT_CRM_CUSTOMER_URL: http://mock-client:8002/mock/customers
      CLIENT_REPLY_WEBHOOK_URL: http://mock-client:8002/mock/replies
      CLIENT_REPLY_AUTH_MODE: basic
      CLIENT_API_USER: mock-client
      CLIENT_API_PASSWORD: mock-secret
      CLIENT_TEST_MEDIA_HOSTS: mock-client
    ports:
      - "8005:8001"
    depends_on:
      redis:
        condition: service_healthy
      mock-client:
        condition: service_healthy
      lab-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  lab-worker:
    profiles: ["lab"]
    build: .
    command: python client_worker.py
    env_file:
      - .env.mock
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_QUEUE_NAME: client-lab
      CLIENT_ENV: test
      CLIENT_VALIDATE_CONFIG: "true"
      CLIENT_TEST_MODE: "true"
      CLIENT_STUB_CUSTOMER: "false"
      CLIENT_CRM_CUSTOMER_URL: http://mock-client:8002/mock/customers
      CLIENT_REPLY_WEBHOOK_URL: http://mock-client:8002/mock/replies
      CLIENT_REPLY_AUTH_MODE: basic
      CLIENT_API_USER: mock-client
      CLIENT_API_PASSWORD: mock-secret
      CLIENT_TEST_MEDIA_HOSTS: mock-client
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mock-client:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  redis-data:
